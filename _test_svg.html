
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div style="width: 450px;">
    <svg width="100%" height="100%" viewBox="0 0 500 673" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="clip-path-hero" clipPathUnits="userSpaceOnUse">
          <path d="M165.836,1644.64C94.328,1209.04 90.753,779.697 165.349,357.564C180.459,272.058 246.591,204.825 331.662,187.446C599.258,132.777 869.097,133.687 1141.07,187.523C1228.32,204.794 1295.77,274.608 1309.15,362.538C1375.85,800.802 1379.67,1230.03 1311.42,1648.91C1297.09,1736.89 1228.64,1806.34 1140.92,1822.2C881.395,1869.15 613.861,1865.59 339.554,1819.32C250.208,1804.25 180.513,1734.05 165.836,1644.64Z" transform="matrix(0.399961,0,0,0.399961,-44.3128,-58.0804)" />
        </clipPath>
      </defs>
      <foreignObject clip-path="url(#clip-path-hero)" width="100%" height="100%">
        <img id="test-img" src="images/IMG_1211.jpg" alt="The Couple">
      </foreignObject>
    </svg>
  </div>
  <pre id="log"></pre>
  <script>
    window.onload = () => {
      const img = document.getElementById('test-img');
      const fo = document.querySelector('foreignObject');
      const rect = img.getBoundingClientRect();
      const foRect = fo.getBoundingClientRect();
      const cs = window.getComputedStyle(img);
      document.getElementById('log').textContent = JSON.stringify({
          imgNatural: [img.naturalWidth, img.naturalHeight],
          imgRect: [rect.width, rect.height],
          imgStyle: { width: cs.width, height: cs.height, maxWidth: cs.maxWidth, maxHeight: cs.maxHeight },
          foRect: [foRect.width, foRect.height]
      }, null, 2);
    };
  </script>
</body>
</html>
